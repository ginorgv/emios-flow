name: Build EMIOS Flow image

# Construye la imagen del fork (Activepieces CE con la marca EMIOS) y la publica
# en GitHub Container Registry (ghcr.io). Railway tira de esa imagen.
#
# Coste para ti: 0 descargas. El build lo hace GitHub en la nube.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/server/api/src/app/flags/theme.ts'
      - 'packages/web/public/brand/**'
      - '.github/workflows/build.yml'

env:
  REGISTRY: ghcr.io
  # OJO: los nombres de imagen en GHCR deben ir en minusculas.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # El monorepo de Activepieces + la caché de BuildKit pueden agotar los ~14 GB
      # libres del runner. Liberamos lo que Ubuntu trae preinstalado y no usamos.
      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 'latest' lo consume Railway. La etiqueta con numero de build permite
          # volver atras a una version concreta desde Railway si algo falla.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
